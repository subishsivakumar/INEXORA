services:
  # 1. iNexora Frontend (Vite React SPA)
  - type: web
    name: inexora-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: /api

  # 2. iNexora Backend (Spring Boot Web Service)
  - type: web
    name: inexora-backend
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: CORS_ALLOWED_ORIGINS
        value: https://inexora-frontend.onrender.com,http://localhost:5173
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 220" width="100%" height="100%">
  <defs>
    <!-- Apple TV 4K Matte Black Console -->
    <linearGradient id="tvBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#28282C"/>
      <stop offset="50%" stop-color="#1A1A1E"/>
      <stop offset="100%" stop-color="#0E0E12"/>
    </linearGradient>

    <!-- Siri Remote Silver Aluminum -->
    <linearGradient id="remoteSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8E9EC"/>
      <stop offset="50%" stop-color="#C6C8CE"/>
      <stop offset="100%" stop-color="#9C9EA4"/>
    </linearGradient>

    <linearGradient id="tvGoldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="tvShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#tvShadow)">
    <!-- Apple TV 4K Console Box -->
    <rect x="36" y="58" width="134" height="116" rx="28" fill="url(#tvBlack)" stroke="url(#tvGoldRim)" stroke-width="1.4"/>
    
    <!-- Top Recessed Apple TV 4K Emblem -->
    <g transform="translate(86, 92) scale(0.65)" fill="#505058" opacity="0.6">
      <path d="M15.5 0C14 0 11.5 1 10 2.5C8.5 4 7.5 6.5 8 9C10 9 12 8 13.5 6.5C15 5 16 2.5 15.5 0Z"/>
      <path d="M19.5 9.5C16.5 9.5 15 8 13 8C11 8 9.5 9.5 7.5 9.5C4 9.5 1 12.5 1 18C1 23.5 6 30 9 30C10.5 30 11.5 29 13 29C14.5 29 15.5 30 17 30C20 30 25 23.5 25 18C23 17 22 15 22 13C22 10.5 23.5 9.5 24 9.5C22.5 9.5 20.5 9.5 19.5 9.5Z"/>
      <!-- 'tv' text -->
      <text x="32" y="24" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#505058">tv</text>
    </g>

    <!-- Front Status LED -->
    <circle cx="103" cy="164" r="1.5" fill="#FFFFFF"/>
    <circle cx="103" cy="164" r="3" fill="#FFFFFF" opacity="0.2"/>

    <!-- Siri Remote (Standing beside console) -->
    <g transform="translate(190, 36)">
      <rect x="0" y="0" width="54" height="152" rx="14" fill="url(#remoteSilver)" stroke="url(#tvGoldRim)" stroke-width="1.2"/>
      
      <!-- Clickpad Navigation Ring -->
      <circle cx="27" cy="34" r="18" fill="#1C1D20" stroke="#D4AF37" stroke-width="0.8"/>
      <circle cx="27" cy="34" r="8" fill="#2E3036"/>

      <!-- Controls: Power, Back, TV, Play/Pause, Mute -->
      <circle cx="18" cy="70" r="5" fill="#202226"/>
      <circle cx="36" cy="70" r="5" fill="#202226"/>
      <circle cx="18" cy="90" r="5" fill="#202226"/>
      <!-- Volume Rocker -->
      <rect x="32" y="85" width="8" height="24" rx="4" fill="#202226"/>
      <circle cx="18" cy="110" r="5" fill="#202226"/>

      <!-- Right Edge Siri Mic Button Inset -->
      <rect x="53" y="44" width="2" height="14" rx="1" fill="#D4AF37"/>
    </g>
  </g>
</svg>

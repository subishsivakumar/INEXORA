<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="maxAlum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#404048"/>
      <stop offset="50%" stop-color="#24242A"/>
      <stop offset="100%" stop-color="#141418"/>
    </linearGradient>
    <linearGradient id="canopyMesh" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#282830"/>
      <stop offset="100%" stop-color="#16161C"/>
    </linearGradient>
    <filter id="maxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#maxShadow)">
    <!-- Breathable Knit Mesh Canopy Band -->
    <path d="M 68 110 C 68 60 90 40 120 40 C 150 40 172 60 172 110" fill="none" stroke="url(#canopyMesh)" stroke-width="18" stroke-linecap="round"/>
    <!-- Stainless Steel Frame Arms -->
    <path d="M 62 120 C 62 55 86 34 120 34 C 154 34 178 55 178 120" fill="none" stroke="#60606C" stroke-width="3" stroke-linecap="round"/>

    <!-- Left Anodized Aluminum Ear Cup -->
    <g transform="translate(42, 105)">
      <rect x="0" y="0" width="38" height="66" rx="19" fill="url(#maxAlum)" stroke="rgba(245, 245, 247, 0.25)" stroke-width="1.2"/>
      <!-- Acoustically Engineered Memory Foam Cushion -->
      <rect x="18" y="4" width="22" height="58" rx="11" fill="#18181E" stroke="rgba(0,0,0,0.4)" stroke-width="1"/>
    </g>

    <!-- Right Anodized Aluminum Ear Cup -->
    <g transform="translate(160, 105)">
      <rect x="0" y="0" width="38" height="66" rx="19" fill="url(#maxAlum)" stroke="rgba(245, 245, 247, 0.25)" stroke-width="1.2"/>
      <rect x="-2" y="4" width="22" height="58" rx="11" fill="#18181E" stroke="rgba(0,0,0,0.4)" stroke-width="1"/>
      <!-- Digital Crown on Right Cup -->
      <rect x="12" y="-4" width="10" height="5" rx="2" fill="#585864"/>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <!-- Titanium Body Gradient -->
    <linearGradient id="proMaxBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5A554E"/>
      <stop offset="35%" stop-color="#3D3A35"/>
      <stop offset="70%" stop-color="#282623"/>
      <stop offset="100%" stop-color="#191816"/>
    </linearGradient>

    <!-- Super Retina XDR OLED Screen -->
    <linearGradient id="proMaxScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="50%" stop-color="#0A0A0C"/>
      <stop offset="100%" stop-color="#050506"/>
    </linearGradient>

    <!-- Gold Accent Rim -->
    <linearGradient id="proMaxRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#B08D42" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8C6D2D" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Camera Plateau -->
    <linearGradient id="cameraPlateau" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#45423D"/>
      <stop offset="100%" stop-color="#22201D"/>
    </linearGradient>

    <!-- Lens Ring -->
    <radialGradient id="lensReflect" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2A2A38"/>
      <stop offset="45%" stop-color="#12121A"/>
      <stop offset="85%" stop-color="#050508"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <filter id="proMaxShadow" x="-25%" y="-20%" width="150%" height="145%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#proMaxShadow)">
    <!-- Outer Titanium Chasis - 6.9-inch Proportion -->
    <rect x="88" y="22" width="144" height="276" rx="36" fill="url(#proMaxBody)" stroke="url(#proMaxRim)" stroke-width="1.8"/>
    
    <!-- Screen Bezel with Minimal Pro Borders -->
    <rect x="93" y="27" width="134" height="266" rx="32" fill="url(#proMaxScreen)" stroke="#111114" stroke-width="1"/>
    
    <!-- Dynamic Island -->
    <rect x="140" y="38" width="40" height="11" rx="5.5" fill="#000000"/>
    <circle cx="170" cy="43.5" r="3" fill="#181822"/>

    <!-- Subtle Screen Reflection / Glare Angle -->
    <path d="M 96 38 L 220 220 L 205 235 L 96 72 Z" fill="#FFFFFF" opacity="0.04"/>

    <!-- Left Side Buttons: Action Button & Volume -->
    <rect x="85" y="68" width="2.5" height="14" rx="1.2" fill="#B08D42"/>
    <rect x="85" y="90" width="2.5" height="24" rx="1.2" fill="#5A554E"/>
    <rect x="85" y="122" width="2.5" height="24" rx="1.2" fill="#5A554E"/>

    <!-- Right Side: Power Button & Camera Control -->
    <rect x="232.5" y="85" width="2.5" height="36" rx="1.2" fill="#5A554E"/>
    <!-- Recessed Capacitive Camera Control Sensor -->
    <rect x="232.5" y="165" width="2.5" height="22" rx="1.2" fill="#D4AF37"/>

    <!-- Mini Pro Camera Preview Island (Backplate Inset) -->
    <g transform="translate(100, 48) scale(0.65)" opacity="0.95">
      <!-- Contoured Glass Camera Island -->
      <rect x="4" y="4" width="76" height="82" rx="20" fill="url(#cameraPlateau)" stroke="rgba(212, 175, 55, 0.4)" stroke-width="1.2"/>
      <!-- Main 48MP Fusion Lens -->
      <circle cx="28" cy="28" r="15" fill="#1C1B18" stroke="#D4AF37" stroke-width="1.5"/>
      <circle cx="28" cy="28" r="11" fill="url(#lensReflect)"/>
      <circle cx="26" cy="26" r="3" fill="#4B6584" opacity="0.6"/>

      <!-- 48MP Ultra-Wide Lens -->
      <circle cx="28" cy="62" r="15" fill="#1C1B18" stroke="#D4AF37" stroke-width="1.5"/>
      <circle cx="28" cy="62" r="11" fill="url(#lensReflect)"/>
      <circle cx="26" cy="60" r="3" fill="#4B6584" opacity="0.6"/>

      <!-- 5x Telephoto Periscope Prism Lens -->
      <circle cx="58" cy="45" r="15" fill="#1C1B18" stroke="#D4AF37" stroke-width="1.5"/>
      <circle cx="58" cy="45" r="11" fill="url(#lensReflect)"/>
      <circle cx="56" cy="43" r="3" fill="#4B6584" opacity="0.6"/>

      <!-- LiDAR Scanner & True Tone Flash -->
      <circle cx="58" cy="22" r="6" fill="#FBF8EE" stroke="#D4AF37" stroke-width="0.8"/>
      <circle cx="58" cy="68" r="5" fill="#111113"/>
    </g>

    <!-- Bottom Emblem & Speaker Grille Accents -->
    <rect x="125" y="286" width="70" height="2" rx="1" fill="#FFFFFF" opacity="0.25"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Midnight Seamless Acoustic Mesh Gradient -->
    <linearGradient id="hpMidnight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34353C"/>
      <stop offset="35%" stop-color="#222328"/>
      <stop offset="70%" stop-color="#141518"/>
      <stop offset="100%" stop-color="#0A0A0C"/>
    </linearGradient>

    <!-- Top Backlit Touch Display -->
    <radialGradient id="touchGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#B08D42" stop-opacity="0.6"/>
      <stop offset="75%" stop-color="#3A3420" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#141518"/>
    </radialGradient>

    <linearGradient id="hpGoldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="hpShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#hpShadow)">
    <!-- Full-Size Cylindrical Acoustic Body -->
    <rect x="52" y="32" width="136" height="176" rx="54" fill="url(#hpMidnight)" stroke="url(#hpGoldRim)" stroke-width="1.5"/>

    <!-- Subtle Mesh Pattern Simulation Lines -->
    <path d="M 60 70 Q 120 85 180 70" fill="none" stroke="#FFFFFF" opacity="0.04" stroke-width="1"/>
    <path d="M 60 110 Q 120 125 180 110" fill="none" stroke="#FFFFFF" opacity="0.04" stroke-width="1"/>
    <path d="M 60 150 Q 120 165 180 150" fill="none" stroke="#FFFFFF" opacity="0.04" stroke-width="1"/>

    <!-- Top Edge-to-Edge Backlit Touch Interface -->
    <ellipse cx="120" cy="46" rx="42" ry="12" fill="url(#touchGlow)" stroke="#D4AF37" stroke-width="1"/>
    
    <!-- Touch Surface Siri Waveform Center Glow -->
    <ellipse cx="120" cy="46" rx="18" ry="5" fill="#FFFFFF" opacity="0.8"/>
    <!-- Volume Plus / Minus Indicators -->
    <line x1="98" y1="46" x2="106" y2="46" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="134" y1="46" x2="142" y2="46" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="138" y1="42" x2="138" y2="50" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>

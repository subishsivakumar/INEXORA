<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="watchBand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#28282D"/>
      <stop offset="100%" stop-color="#141418"/>
    </linearGradient>
    <linearGradient id="watchCase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C4C54"/>
      <stop offset="50%" stop-color="#28282E"/>
      <stop offset="100%" stop-color="#1A1A1E"/>
    </linearGradient>
    <filter id="watchShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Upper Band Strap -->
  <path d="M 88 15 L 152 15 L 146 72 L 94 72 Z" fill="url(#watchBand)"/>
  <!-- Lower Band Strap -->
  <path d="M 94 168 L 146 168 L 152 225 L 88 225 Z" fill="url(#watchBand)"/>

  <g filter="url(#watchShadow)">
    <!-- Watch Case Squircle -->
    <rect x="74" y="66" width="92" height="108" rx="26" fill="url(#watchCase)" stroke="rgba(245, 245, 247, 0.25)" stroke-width="1.5"/>
    
    <!-- Curved OLED Screen -->
    <rect x="80" y="72" width="80" height="96" rx="21" fill="#070709" stroke="#16161B" stroke-width="1"/>

    <!-- Watch Face Digital Dial Minimalist Graphic -->
    <circle cx="120" cy="120" r="34" fill="none" stroke="rgba(245, 245, 247, 0.15)" stroke-width="1.5" stroke-dasharray="2 6"/>
    <circle cx="120" cy="120" r="2.5" fill="#F5F5F7"/>
    <line x1="120" y1="120" x2="134" y2="106" stroke="#F5F5F7" stroke-width="2" stroke-linecap="round"/>
    <line x1="120" y1="120" x2="110" y2="135" stroke="rgba(245, 245, 247, 0.5)" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Digital Crown on Right -->
    <rect x="168" y="85" width="5" height="22" rx="2.5" fill="#5A5A62" stroke="rgba(245, 245, 247, 0.3)" stroke-width="0.8"/>
    <!-- Side Button -->
    <rect x="168" y="117" width="3" height="28" rx="1.5" fill="#38383E"/>
  </g>
</svg>

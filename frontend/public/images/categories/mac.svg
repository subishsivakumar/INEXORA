<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="macAlum" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A3A40"/>
      <stop offset="100%" stop-color="#1E1E22"/>
    </linearGradient>
    <linearGradient id="macScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24242A"/>
      <stop offset="100%" stop-color="#0E0E12"/>
    </linearGradient>
    <filter id="macShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#macShadow)">
    <!-- Display Lid -->
    <rect x="42" y="44" width="156" height="106" rx="10" fill="url(#macAlum)" stroke="rgba(245, 245, 247, 0.25)" stroke-width="1.2"/>
    <!-- Liquid Retina XDR Screen -->
    <rect x="46" y="48" width="148" height="98" rx="7" fill="url(#macScreen)" stroke="#111114" stroke-width="1"/>
    
    <!-- Camera Notch -->
    <rect x="114" y="48" width="12" height="5" rx="2" fill="#000"/>
    <circle cx="120" cy="50.5" r="1.5" fill="#1C1C24"/>

    <!-- Keyboard Base / Lower Deck -->
    <path d="M 22 160 L 218 160 C 220 160 221 161 220 163 L 208 178 C 206 181 202 183 198 183 L 42 183 C 38 183 34 181 32 178 L 20 163 C 19 161 20 160 22 160 Z" fill="url(#macAlum)" stroke="rgba(245, 245, 247, 0.2)" stroke-width="1.2"/>
    
    <!-- Trackpad & Notch Cutout -->
    <rect x="100" y="162" width="40" height="2" rx="1" fill="#151518"/>
    <rect x="94" y="167" width="52" height="12" rx="3" fill="#242428" stroke="rgba(245, 245, 247, 0.1)" stroke-width="0.8"/>
  </g>
</svg>

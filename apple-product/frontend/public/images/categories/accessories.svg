<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="accWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E5E5EB"/>
    </linearGradient>
    <linearGradient id="accBlack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D2D33"/>
      <stop offset="100%" stop-color="#141418"/>
    </linearGradient>
    <filter id="accShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g filter="url(#accShadow)">
    <!-- Magic Keyboard Slim Base in Background -->
    <rect x="35" y="105" width="170" height="70" rx="8" fill="url(#accBlack)" stroke="rgba(245, 245, 247, 0.2)" stroke-width="1.2"/>
    <!-- Key Rows Representation -->
    <rect x="42" y="112" width="156" height="42" rx="4" fill="#0C0C0F"/>
    <g fill="rgba(245, 245, 247, 0.15)">
      <!-- Row 1 -->
      <rect x="46" y="116" width="10" height="8" rx="2"/>
      <rect x="60" y="116" width="10" height="8" rx="2"/>
      <rect x="74" y="116" width="10" height="8" rx="2"/>
      <rect x="88" y="116" width="10" height="8" rx="2"/>
      <rect x="102" y="116" width="10" height="8" rx="2"/>
      <rect x="116" y="116" width="10" height="8" rx="2"/>
      <rect x="130" y="116" width="10" height="8" rx="2"/>
      <rect x="144" y="116" width="10" height="8" rx="2"/>
      <rect x="158" y="116" width="10" height="8" rx="2"/>
      <rect x="172" y="116" width="22" height="8" rx="2"/>
      <!-- Row 2 (Spacebar) -->
      <rect x="46" y="128" width="16" height="8" rx="2"/>
      <rect x="66" y="128" width="80" height="8" rx="2"/>
      <rect x="150" y="128" width="16" height="8" rx="2"/>
      <rect x="170" y="128" width="24" height="8" rx="2"/>
    </g>

    <!-- Apple Pencil Pro Diagonally Across -->
    <g transform="rotate(-32, 110, 80)">
      <rect x="25" y="74" width="180" height="8" rx="4" fill="url(#accWhite)" stroke="rgba(0,0,0,0.15)" stroke-width="0.8"/>
      <!-- Tip -->
      <polygon points="205,74 218,78 205,82" fill="#D2D2D8"/>
    </g>

    <!-- Magic Mouse Profile on Right -->
    <ellipse cx="180" cy="148" rx="24" ry="16" fill="url(#accBlack)" stroke="rgba(245, 245, 247, 0.3)" stroke-width="1"/>
    <ellipse cx="180" cy="144" rx="16" ry="6" fill="#FFFFFF" opacity="0.05"/>
  </g>
</svg>

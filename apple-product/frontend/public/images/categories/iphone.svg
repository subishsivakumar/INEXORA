<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="ipTitanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A4A50"/>
      <stop offset="50%" stop-color="#2D2D32"/>
      <stop offset="100%" stop-color="#1A1A1E"/>
    </linearGradient>
    <linearGradient id="ipGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181C"/>
      <stop offset="100%" stop-color="#0B0B0D"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A3A42"/>
      <stop offset="100%" stop-color="#101014"/>
    </linearGradient>
    <filter id="ipShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#ipShadow)">
    <!-- Titanium Body -->
    <rect x="68" y="22" width="104" height="196" rx="28" fill="url(#ipTitanium)" stroke="rgba(245, 245, 247, 0.25)" stroke-width="1.5"/>
    
    <!-- Screen / Ceramic Shield Front -->
    <rect x="73" y="27" width="94" height="186" rx="24" fill="url(#ipGlass)" stroke="#111114" stroke-width="1"/>
    
    <!-- Dynamic Island -->
    <rect x="105" y="38" width="30" height="9" rx="4.5" fill="#000"/>
    <circle cx="127" cy="42.5" r="2.5" fill="#1C1C22"/>

    <!-- Subtle Screen Reflection Accent -->
    <path d="M 76 35 L 140 180 L 130 190 L 76 60 Z" fill="#FFFFFF" opacity="0.04"/>

    <!-- Volume & Power Buttons -->
    <rect x="65" y="60" width="2" height="12" rx="1" fill="#4A4A50"/>
    <rect x="65" y="80" width="2" height="20" rx="1" fill="#4A4A50"/>
    <rect x="65" y="106" width="2" height="20" rx="1" fill="#4A4A50"/>
    <rect x="173" y="75" width="2" height="28" rx="1" fill="#4A4A50"/>
    
    <!-- Camera Control Recessed Area -->
    <rect x="173" y="140" width="2" height="16" rx="1" fill="#777780"/>
  </g>
</svg>

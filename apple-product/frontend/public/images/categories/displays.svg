<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="dispScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#26262C"/>
      <stop offset="100%" stop-color="#0E0E12"/>
    </linearGradient>
    <linearGradient id="dispStand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#707078"/>
      <stop offset="50%" stop-color="#4E4E56"/>
      <stop offset="100%" stop-color="#303036"/>
    </linearGradient>
    <filter id="dispShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <g filter="url(#dispShadow)">
    <!-- Pro Stand Vertical Column -->
    <path d="M 112 142 L 128 142 L 126 195 L 114 195 Z" fill="url(#dispStand)"/>
    <!-- Pro Stand Base Footprint -->
    <rect x="92" y="194" width="56" height="5" rx="2.5" fill="url(#dispStand)" stroke="rgba(245, 245, 247, 0.25)" stroke-width="0.8"/>

    <!-- 5K/6K Retina Panel Aluminum Enclosure -->
    <rect x="36" y="38" width="168" height="110" rx="10" fill="#18181D" stroke="rgba(245, 245, 247, 0.3)" stroke-width="1.5"/>
    <!-- Edge-to-Edge Glass -->
    <rect x="42" y="44" width="156" height="98" rx="6" fill="url(#dispScreen)" stroke="#000" stroke-width="1"/>

    <!-- Center Stage 12MP Camera at Top -->
    <circle cx="120" cy="48" r="2" fill="#3E3E48"/>

    <!-- Subtle Diagonal Glare Reflection -->
    <path d="M 46 48 L 180 140 L 160 140 L 46 64 Z" fill="#FFFFFF" opacity="0.04"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180" width="100%" height="100%">
  <defs>
    <!-- Matte White Ceramic Cylindrical Body -->
    <linearGradient id="pencilWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F2F3F6"/>
      <stop offset="100%" stop-color="#D8DCE2"/>
    </linearGradient>

    <!-- Warm Gold / Champagne Accent Ring -->
    <linearGradient id="pencilGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B08D42"/>
    </linearGradient>

    <filter id="pencilShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#pencilShadow)">
    <!-- Flat Magnetic Edge & Barrel (Tilted Elegantly at 15 degrees) -->
    <g transform="translate(140, 90) rotate(-15) translate(-140, -90)">
      <!-- Main Matte Body -->
      <rect x="52" y="82" width="186" height="16" rx="8" fill="url(#pencilWhite)" stroke="rgba(212, 175, 55, 0.4)" stroke-width="1.2"/>
      
      <!-- Flat Magnetic Charging Surface Highlight -->
      <line x1="58" y1="84" x2="230" y2="84" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>

      <!-- Squeeze Sensor Haptic Ring Inset -->
      <rect x="74" y="81.5" width="2" height="17" rx="1" fill="url(#pencilGold)"/>

      <!-- Barrel Roll Sensor Indicator Accent -->
      <circle cx="86" cy="90" r="1.5" fill="#B08D42"/>

      <!-- Precision Replaceable Pencil Tip -->
      <polygon points="52,83 30,90 52,97" fill="#E8EAF0" stroke="rgba(212, 175, 55, 0.3)" stroke-width="1"/>
      <circle cx="30" cy="90" r="1.2" fill="#787A82"/>

      <!-- Subtle Apple Logo Impression on Rear Cap -->
      <g transform="translate(216, 85) scale(0.35)" fill="#94969E">
        <path d="M15.5 0C14 0 11.5 1 10 2.5C8.5 4 7.5 6.5 8 9C10 9 12 8 13.5 6.5C15 5 16 2.5 15.5 0Z"/>
        <path d="M19.5 9.5C16.5 9.5 15 8 13 8C11 8 9.5 9.5 7.5 9.5C4 9.5 1 12.5 1 18C1 23.5 6 30 9 30C10.5 30 11.5 29 13 29C14.5 29 15.5 30 17 30C20 30 25 23.5 25 18C23 17 22 15 22 13C22 10.5 23.5 9.5 24 9.5C22.5 9.5 20.5 9.5 19.5 9.5Z"/>
      </g>
    </g>
  </g>
</svg>

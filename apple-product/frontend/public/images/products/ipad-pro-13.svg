<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" width="100%" height="100%">
  <defs>
    <!-- Space Black Aluminum Finish -->
    <linearGradient id="ipadProBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#36373A"/>
      <stop offset="50%" stop-color="#242528"/>
      <stop offset="100%" stop-color="#141517"/>
    </linearGradient>

    <!-- Ultra Retina XDR Tandem OLED Screen -->
    <linearGradient id="ipadProScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16171A"/>
      <stop offset="100%" stop-color="#08080A"/>
    </linearGradient>

    <linearGradient id="ipadProGoldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#555560" stop-opacity="0.3"/>
    </linearGradient>

    <filter id="ipadProShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#ipadProShadow)">
    <!-- 5.1mm Ultra-Thin 13-inch Form Factor -->
    <rect x="42" y="24" width="236" height="212" rx="24" fill="url(#ipadProBody)" stroke="url(#ipadProGoldRim)" stroke-width="1.6"/>
    
    <!-- Tandem OLED Screen with Ultra-Narrow Uniform Borders -->
    <rect x="48" y="30" width="224" height="200" rx="18" fill="url(#ipadProScreen)" stroke="#111114" stroke-width="1"/>

    <!-- Landscape 12MP Center Stage Camera -->
    <circle cx="160" cy="35" r="2.2" fill="#252732"/>
    <circle cx="160" cy="35" r="1" fill="#4B6584" opacity="0.8"/>

    <!-- Subtle Glare Angle -->
    <path d="M 52 34 L 260 190 L 235 210 L 52 75 Z" fill="#FFFFFF" opacity="0.04"/>

    <!-- Apple Pencil Pro Magnetic Charging Strip on Top Edge -->
    <rect x="120" y="22.5" width="80" height="2" rx="1" fill="#B08D42" opacity="0.8"/>

    <!-- Quad-Speaker Grille Highlights -->
    <rect x="58" y="22.5" width="20" height="1.5" rx="0.7" fill="#888"/>
    <rect x="242" y="22.5" width="20" height="1.5" rx="0.7" fill="#888"/>
    <rect x="58" y="236" width="20" height="1.5" rx="0.7" fill="#888"/>
    <rect x="242" y="236" width="20" height="1.5" rx="0.7" fill="#888"/>

    <!-- Rear Camera Module (LiDAR Scanner & 12MP Wide) Silhouette Inset -->
    <g transform="translate(56, 40) scale(0.6)" opacity="0.9">
      <rect x="2" y="2" width="38" height="38" rx="10" fill="#1C1D20" stroke="rgba(212, 175, 55, 0.4)" stroke-width="1"/>
      <circle cx="16" cy="16" r="9" fill="#101114" stroke="#D4AF37" stroke-width="1"/>
      <circle cx="16" cy="16" r="6" fill="#1C2836"/>
      <!-- LiDAR & Flash -->
      <circle cx="30" cy="16" r="3.5" fill="#0C0C0E"/>
      <circle cx="30" cy="28" r="3.5" fill="#FBF8EE" stroke="#D4AF37" stroke-width="0.5"/>
    </g>
  </g>
</svg>

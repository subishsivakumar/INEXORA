<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <!-- iPhone 16 Ultramarine & Aerograde Aluminum Body -->
    <linearGradient id="ip16Body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A5885"/>
      <stop offset="40%" stop-color="#243D61"/>
      <stop offset="80%" stop-color="#182A45"/>
      <stop offset="100%" stop-color="#0E1C30"/>
    </linearGradient>

    <linearGradient id="ip16Screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="50%" stop-color="#09090B"/>
      <stop offset="100%" stop-color="#040405"/>
    </linearGradient>

    <!-- Warm Gold / Champagne Edge Accent -->
    <linearGradient id="ip16Rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6B93D6" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Vertical Pill Dual Camera Island -->
    <linearGradient id="pillPlateau" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#32507D"/>
      <stop offset="100%" stop-color="#1A2D4A"/>
    </linearGradient>

    <radialGradient id="ip16LensReflect" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#282836"/>
      <stop offset="45%" stop-color="#12121A"/>
      <stop offset="85%" stop-color="#050508"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <filter id="ip16Shadow" x="-25%" y="-20%" width="150%" height="145%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#ip16Shadow)">
    <!-- Aerograde Aluminum Chasis - 6.1-inch Proportion -->
    <rect x="96" y="28" width="128" height="264" rx="32" fill="url(#ip16Body)" stroke="url(#ip16Rim)" stroke-width="1.8"/>
    
    <!-- Super Retina XDR Screen -->
    <rect x="101" y="33" width="118" height="254" rx="28" fill="url(#ip16Screen)" stroke="#111114" stroke-width="1"/>
    
    <!-- Dynamic Island -->
    <rect x="143" y="44" width="34" height="10" rx="5" fill="#000000"/>
    <circle cx="167" cy="49" r="2.8" fill="#181822"/>

    <!-- Subtle Diagonal Glare -->
    <path d="M 104 44 L 210 206 L 196 220 L 104 74 Z" fill="#FFFFFF" opacity="0.04"/>

    <!-- Left Controls: Action Button & Volume Buttons -->
    <rect x="93.5" y="74" width="2.5" height="13" rx="1.2" fill="#B08D42"/>
    <rect x="93.5" y="95" width="2.5" height="22" rx="1.2" fill="#3A5885"/>
    <rect x="93.5" y="124" width="2.5" height="22" rx="1.2" fill="#3A5885"/>

    <!-- Right Controls: Power Button & Camera Control -->
    <rect x="224" y="90" width="2.5" height="34" rx="1.2" fill="#3A5885"/>
    <rect x="224" y="162" width="2.5" height="20" rx="1.2" fill="#D4AF37"/>

    <!-- Distinct iPhone 16 Vertical Pill Dual Camera Module -->
    <g transform="translate(106, 54) scale(0.62)" opacity="0.95">
      <!-- Vertical Pill Enclosure -->
      <rect x="6" y="6" width="38" height="76" rx="19" fill="url(#pillPlateau)" stroke="rgba(212, 175, 55, 0.45)" stroke-width="1.2"/>
      
      <!-- Top 48MP Fusion Camera Lens -->
      <circle cx="25" cy="25" r="14" fill="#141E2D" stroke="#D4AF37" stroke-width="1.5"/>
      <circle cx="25" cy="25" r="10" fill="url(#ip16LensReflect)"/>
      <circle cx="23" cy="23" r="3" fill="#6B93D6" opacity="0.65"/>

      <!-- Bottom Ultra-Wide Camera Lens (Spatial Video) -->
      <circle cx="25" cy="63" r="14" fill="#141E2D" stroke="#D4AF37" stroke-width="1.5"/>
      <circle cx="25" cy="63" r="10" fill="url(#ip16LensReflect)"/>
      <circle cx="23" cy="61" r="3" fill="#6B93D6" opacity="0.65"/>

      <!-- Offset True Tone Flash & Microphone -->
      <circle cx="56" cy="44" r="5" fill="#FBF8EE" stroke="#D4AF37" stroke-width="0.8"/>
      <circle cx="56" cy="26" r="2.5" fill="#0E1C30"/>
    </g>

    <rect x="132" y="280" width="56" height="2" rx="1" fill="#FFFFFF" opacity="0.25"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Space Gray Spherical Acoustic Mesh -->
    <radialGradient id="miniSphere" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#44464E"/>
      <stop offset="40%" stop-color="#282A30"/>
      <stop offset="80%" stop-color="#18191D"/>
      <stop offset="100%" stop-color="#0E0F12"/>
    </radialGradient>

    <!-- Mini Backlit Touch Disc -->
    <radialGradient id="miniTouchGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#B08D42" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#24252B"/>
    </radialGradient>

    <linearGradient id="hpMiniRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="miniHpShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#miniHpShadow)">
    <!-- 3.3-inch Spherical Acoustic Form Factor -->
    <circle cx="120" cy="126" r="76" fill="url(#miniSphere)" stroke="url(#hpMiniRim)" stroke-width="1.4"/>

    <!-- Subtle Mesh Latitude Curves -->
    <path d="M 60 110 Q 120 135 180 110" fill="none" stroke="#FFFFFF" opacity="0.04" stroke-width="1"/>
    <path d="M 52 135 Q 120 160 188 135" fill="none" stroke="#FFFFFF" opacity="0.04" stroke-width="1"/>

    <!-- Flat Top Touch Disc -->
    <ellipse cx="120" cy="62" rx="34" ry="10" fill="url(#miniTouchGlow)" stroke="#D4AF37" stroke-width="1"/>
    
    <!-- Siri Center Orb Indicator -->
    <ellipse cx="120" cy="62" rx="14" ry="4" fill="#FFFFFF" opacity="0.85"/>
    <!-- Controls (+ and -) -->
    <line x1="102" y1="62" x2="108" y2="62" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="132" y1="62" x2="138" y2="62" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="135" y1="59" x2="135" y2="65" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Base Acoustic Waveguide Ring -->
    <ellipse cx="120" cy="198" rx="38" ry="6" fill="#141518" opacity="0.8"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 220" width="100%" height="100%">
  <defs>
    <!-- Glossy White Ceramic Finish -->
    <linearGradient id="apWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F2F3F5"/>
      <stop offset="100%" stop-color="#DCE0E6"/>
    </linearGradient>

    <!-- Warm Gold Lid Seam / Lanyard Loop Accent -->
    <linearGradient id="apGoldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.4"/>
    </linearGradient>

    <filter id="apShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#apShadow)">
    <!-- AirPods Pro 2 MagSafe Case -->
    <rect x="52" y="62" width="156" height="114" rx="34" fill="url(#apWhite)" stroke="url(#apGoldRim)" stroke-width="1.4"/>

    <!-- Horizontal Lid Seam -->
    <line x1="52" y1="94" x2="208" y2="94" stroke="#D0D3D9" stroke-width="1.2"/>

    <!-- LED Status Indicator -->
    <circle cx="130" cy="118" r="2" fill="#52B79A"/>
    <circle cx="130" cy="118" r="4" fill="#52B79A" opacity="0.25"/>

    <!-- Right Side Metal Lanyard Loop Inset -->
    <rect x="207.5" y="112" width="2" height="16" rx="1" fill="#D4AF37"/>

    <!-- Bottom Speaker Grilles for Find My Tracking -->
    <circle cx="115" cy="172" r="1.5" fill="#555"/>
    <circle cx="120" cy="172" r="1.5" fill="#555"/>
    <circle cx="140" cy="172" r="1.5" fill="#555"/>
    <circle cx="145" cy="172" r="1.5" fill="#555"/>

    <!-- Earbuds Silhouette Peeking / Acoustic Vents -->
    <g transform="translate(76, 22) scale(0.7)" opacity="0.95">
      <!-- Left In-Ear Pro Earbud with Stem -->
      <path d="M 30 50 C 15 50 10 35 15 20 C 20 8 38 8 46 20 C 50 26 50 35 48 40 L 48 85 C 48 90 42 94 38 94 L 38 94 C 34 94 30 90 30 85 Z" fill="url(#apWhite)" stroke="url(#apGoldRim)" stroke-width="1.5"/>
      <!-- Silicone Ear Tip -->
      <ellipse cx="20" cy="22" rx="12" ry="9" fill="#E6E8ED" stroke="#B08D42" stroke-width="1"/>
      <!-- Force Sensor Indentation on Stem -->
      <rect x="36" y="58" width="4" height="14" rx="2" fill="#D4AF37" opacity="0.8"/>
      <!-- Acoustic Mesh Vent -->
      <ellipse cx="38" cy="22" rx="4" ry="7" fill="#1C1D20"/>
    </g>

    <g transform="translate(132, 22) scale(0.7)" opacity="0.95">
      <!-- Right In-Ear Pro Earbud -->
      <path d="M 40 50 C 55 50 60 35 55 20 C 50 8 32 8 24 20 C 20 26 20 35 22 40 L 22 85 C 22 90 28 94 32 94 L 32 94 C 36 94 40 90 40 85 Z" fill="url(#apWhite)" stroke="url(#apGoldRim)" stroke-width="1.5"/>
      <!-- Silicone Ear Tip -->
      <ellipse cx="50" cy="22" rx="12" ry="9" fill="#E6E8ED" stroke="#B08D42" stroke-width="1"/>
      <!-- Force Sensor -->
      <rect x="30" y="58" width="4" height="14" rx="2" fill="#D4AF37" opacity="0.8"/>
      <!-- Mesh Vent -->
      <ellipse cx="32" cy="22" rx="4" ry="7" fill="#1C1D20"/>
    </g>
  </g>
</svg>

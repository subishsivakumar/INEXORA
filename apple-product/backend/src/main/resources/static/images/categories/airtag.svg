<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <radialGradient id="airtagSteel" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#E2E2E8"/>
      <stop offset="70%" stop-color="#AEAEB8"/>
      <stop offset="100%" stop-color="#70707C"/>
    </radialGradient>
    <radialGradient id="airtagWhite" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#EDEDF4"/>
      <stop offset="100%" stop-color="#D4D4DE"/>
    </radialGradient>
    <filter id="airtagShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g filter="url(#airtagShadow)">

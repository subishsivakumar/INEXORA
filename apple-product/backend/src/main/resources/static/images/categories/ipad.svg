<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="ipadBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3C3C42"/>
      <stop offset="100%" stop-color="#1E1E22"/>
    </linearGradient>
    <linearGradient id="ipadGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B1B20"/>
      <stop offset="100%" stop-color="#0B0B0D"/>
    </linearGradient>
    <filter id="ipadShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#ipadShadow)">
    <!-- Symmetrical Tablet Body -->
    <rect x="52" y="32" width="136" height="176" rx="20" fill="url(#ipadBody)" stroke="rgba(245, 245, 247, 0.22)" stroke-width="1.2"/>
    
    <!-- Ultra Retina XDR Tandem OLED Display -->
    <rect x="58" y="38" width="124" height="164" rx="15" fill="url(#ipadGlass)" stroke="#111114" stroke-width="1"/>
    
    <!-- Landscape Front Camera Sensor on Long Edge -->
    <circle cx="120" cy="42" r="2" fill="#2A2A32"/>

    <!-- Subtle Diagonal Glare Reflection -->
    <path d="M 60 45 L 170 190 L 155 198 L 60 85 Z" fill="#FFFFFF" opacity="0.035"/>

    <!-- Attached Apple Pencil Silhouette on Top/Side Magnetic Surface -->
    <rect x="191" y="60" width="4" height="120" rx="2" fill="#E8E8EC" stroke="rgba(0,0,0,0.3)" stroke-width="0.5"/>
    <polygon points="191,180 195,180 193,188" fill="#D0D0D6"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="vpEnclosure" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14141A"/>
      <stop offset="30%" stop-color="#343440"/>
      <stop offset="50%" stop-color="#181820"/>
      <stop offset="70%" stop-color="#32323E"/>
      <stop offset="100%" stop-color="#121218"/>
    </linearGradient>
    <linearGradient id="vpAlum" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#545460"/>
      <stop offset="100%" stop-color="#282832"/>
    </linearGradient>
    <linearGradient id="vpRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#383842"/>
      <stop offset="100%" stop-color="#1A1A22"/>
    </linearGradient>
    <filter id="vpShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Solo Knit Band -->
  <path d="M 30 110 C 20 110 16 120 16 130 C 16 145 32 155 52 155 L 75 145" fill="none" stroke="url(#vpRibbon)" stroke-width="26" stroke-linecap="round"/>
  <path d="M 210 110 C 220 110 224 120 224 130 C 224 145 208 155 188 155 L 165 145" fill="none" stroke="url(#vpRibbon)" stroke-width="26" stroke-linecap="round"/>

  <g filter="url(#vpShadow)">
    <!-- Light Seal Cushioned Frame -->
    <path d="M 44 116 C 44 90 78 80 120 80 C 162 80 196 90 196 116 C 196 142 162 150 120 150 C 78 150 44 142 44 116 Z" fill="url(#vpAlum)"/>

    <!-- 3D Formed Curved Laminated Glass (EyeSight) -->
    <path d="M 50 116 C 50 93 80 84 120 84 C 160 84 190 93 190 116 C 190 138 160 145 120 145 C 80 145 50 138 50 116 Z" fill="url(#vpEnclosure)" stroke="rgba(245, 245, 247, 0.35)" stroke-width="1.2"/>

    <!-- Glare Reflection -->
    <ellipse cx="95" cy="110" rx="35" ry="15" fill="#FFFFFF" opacity="0.05" transform="rotate(-10, 95, 110)"/>

    <!-- Digital Crown -->
    <rect x="156" y="78" width="12" height="6" rx="2" fill="#70707E"/>
    <!-- Top Button -->
    <rect x="72" y="78" width="12" height="6" rx="2" fill="#444450"/>
  </g>
</svg>

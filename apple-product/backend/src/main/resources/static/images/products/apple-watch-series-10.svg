<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Jet Black / Polished Titanium Case -->
    <linearGradient id="s10Case" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A3A40"/>
      <stop offset="40%" stop-color="#202024"/>
      <stop offset="80%" stop-color="#121215"/>
      <stop offset="100%" stop-color="#08080A"/>
    </linearGradient>

    <!-- Wide-Angle OLED Curved Screen -->
    <radialGradient id="s10Screen" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#161820"/>
      <stop offset="70%" stop-color="#0B0C10"/>
      <stop offset="100%" stop-color="#040406"/>
    </radialGradient>

    <!-- Gold Accent Ring -->
    <linearGradient id="s10GoldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#B08D42" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#555" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="s10Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#s10Shadow)">
    <!-- Top & Bottom Sport Band Extensions -->
    <path d="M 85 10 C 85 22 92 34 100 34 L 140 34 C 148 34 155 22 155 10 Z" fill="#24252A" stroke="#1A1B1F" stroke-width="1"/>
    <path d="M 85 230 C 85 218 92 206 100 206 L 140 206 C 148 206 155 218 155 230 Z" fill="#24252A" stroke="#1A1B1F" stroke-width="1"/>

    <!-- 9.7mm Slim Case Chasis -->
    <rect x="68" y="34" width="104" height="172" rx="36" fill="url(#s10Case)" stroke="url(#s10GoldRim)" stroke-width="1.6"/>

    <!-- Wide-Angle Curved OLED Screen -->
    <rect x="74" y="40" width="92" height="160" rx="30" fill="url(#s10Screen)" stroke="#111" stroke-width="1"/>

    <!-- Screen Glare Curve -->
    <path d="M 80 50 C 130 50 156 80 156 120 C 156 90 120 46 80 50 Z" fill="#FFFFFF" opacity="0.08"/>

    <!-- Digital Crown on Right Edge with Gold Inset -->
    <rect x="172" y="65" width="8" height="28" rx="3.5" fill="#28282E" stroke="#D4AF37" stroke-width="1"/>
    <line x1="174" y1="71" x2="178" y2="71" stroke="#444" stroke-width="1"/>
    <line x1="174" y1="79" x2="178" y2="79" stroke="#444" stroke-width="1"/>
    <line x1="174" y1="87" x2="178" y2="87" stroke="#444" stroke-width="1"/>

    <!-- Side Flush Button -->
    <rect x="172" y="112" width="4" height="34" rx="2" fill="#202024" stroke="#D4AF37" stroke-width="0.8"/>

    <!-- Watch Face Minimalist Complication Accent -->
    <circle cx="120" cy="120" r="32" fill="none" stroke="#D4AF37" stroke-width="1.2" stroke-dasharray="2, 6"/>
    <!-- Elegant Gold Clock Hands -->
    <line x1="120" y1="120" x2="120" y2="100" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="120" y1="120" x2="136" y2="126" stroke="#D4AF37" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="120" cy="120" r="3" fill="#D4AF37"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <!-- iPhone 16e Modern Midnight/Black Anodized Aluminum -->
    <linearGradient id="ip16eBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38383E"/>
      <stop offset="40%" stop-color="#25252A"/>
      <stop offset="80%" stop-color="#19191D"/>
      <stop offset="100%" stop-color="#0E0E10"/>
    </linearGradient>

    <linearGradient id="ip16eScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="50%" stop-color="#09090B"/>
      <stop offset="100%" stop-color="#040405"/>
    </linearGradient>

    <!-- Warm Gold Edge Accent -->
    <linearGradient id="ip16eRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#B08D42" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4E4E57" stop-opacity="0.3"/>
    </linearGradient>

    <radialGradient id="ip16eLensReflect" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#282836"/>
      <stop offset="45%" stop-color="#12121A"/>
      <stop offset="85%" stop-color="#050508"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <filter id="ip16eShadow" x="-25%" y="-20%" width="150%" height="145%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#ip16eShadow)">
    <!-- Aerograde Aluminum Chasis - 6.1-inch Proportion -->
    <rect x="96" y="28" width="128" height="264" rx="32" fill="url(#ip16eBody)" stroke="url(#ip16eRim)" stroke-width="1.8"/>
    
    <!-- 6.1-inch OLED Display -->
    <rect x="101" y="33" width="118" height="254" rx="28" fill="url(#ip16eScreen)" stroke="#111114" stroke-width="1"/>
    
    <!-- Dynamic Island -->
    <rect x="143" y="44" width="34" height="10" rx="5" fill="#000000"/>
    <circle cx="167" cy="49" r="2.8" fill="#181822"/>

    <!-- Subtle Diagonal Glare -->
    <path d="M 104 44 L 210 206 L 196 220 L 104 74 Z" fill="#FFFFFF" opacity="0.04"/>

    <!-- Left Controls: Action Button & Volume Buttons -->
    <rect x="93.5" y="74" width="2.5" height="13" rx="1.2" fill="#B08D42"/>
    <rect x="93.5" y="95" width="2.5" height="22" rx="1.2" fill="#38383E"/>
    <rect x="93.5" y="124" width="2.5" height="22" rx="1.2" fill="#38383E"/>

    <!-- Right Controls: Power Button -->
    <rect x="224" y="90" width="2.5" height="34" rx="1.2" fill="#38383E"/>

    <!-- iPhone 16e Streamlined Modern Camera Housing -->
    <g transform="translate(108, 54) scale(0.6)" opacity="0.95">
      <rect x="6" y="6" width="38" height="74" rx="19" fill="#1D1D22" stroke="rgba(212, 175, 55, 0.45)" stroke-width="1.2"/>
      
      <!-- Primary 48MP 2-in-1 Dual-Optics Lens -->
      <circle cx="25" cy="25" r="14" fill="#141418" stroke="#D4AF37" stroke-width="1.5"/>
      <circle cx="25" cy="25" r="10" fill="url(#ip16eLensReflect)"/>
      <circle cx="23" cy="23" r="3" fill="#8E8EA0" opacity="0.6"/>

      <!-- Secondary Sensor / Microphone -->
      <circle cx="25" cy="61" r="11" fill="#141418" stroke="#D4AF37" stroke-width="1.2"/>
      <circle cx="25" cy="61" r="8" fill="url(#ip16eLensReflect)"/>

      <!-- True Tone Flash -->
      <circle cx="56" cy="42" r="5" fill="#FBF8EE" stroke="#D4AF37" stroke-width="0.8"/>
    </g>

    <rect x="132" y="280" width="56" height="2" rx="1" fill="#FFFFFF" opacity="0.25"/>
  </g>
</svg>

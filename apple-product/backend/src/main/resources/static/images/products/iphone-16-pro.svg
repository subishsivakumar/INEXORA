<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <!-- Natural Titanium Body Gradient -->
    <linearGradient id="proBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F4B45"/>
      <stop offset="35%" stop-color="#3A3732"/>
      <stop offset="70%" stop-color="#24221F"/>
      <stop offset="100%" stop-color="#181715"/>
    </linearGradient>

    <linearGradient id="proScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="50%" stop-color="#09090B"/>
      <stop offset="100%" stop-color="#040405"/>
    </linearGradient>

    <!-- Warm Gold/Champagne Edge Rim -->
    <linearGradient id="proRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#B08D42" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8C6D2D" stop-opacity="0.25"/>
    </linearGradient>

    <linearGradient id="cameraPlateauPro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#403D37"/>
      <stop offset="100%" stop-color="#201E1B"/>
    </linearGradient>

    <radialGradient id="proLensReflect" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#282836"/>
      <stop offset="45%" stop-color="#12121A"/>
      <stop offset="85%" stop-color="#050508"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <filter id="proShadow" x="-25%" y="-20%" width="150%" height="145%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#proShadow)">
    <!-- Titanium Body - 6.3-inch Pro Proportion -->
    <rect x="94" y="26" width="132" height="268" rx="34" fill="url(#proBody)" stroke="url(#proRim)" stroke-width="1.8"/>
    
    <!-- ProMotion 120Hz Borderless Screen -->
    <rect x="99" y="31" width="122" height="258" rx="30" fill="url(#proScreen)" stroke="#111114" stroke-width="1"/>
    
    <!-- Dynamic Island -->
    <rect x="142" y="42" width="36" height="10" rx="5" fill="#000000"/>
    <circle cx="168" cy="47" r="2.8" fill="#181822"/>

    <!-- Subtle Glare -->
    <path d="M 102 42 L 214 212 L 200 226 L 102 72 Z" fill="#FFFFFF" opacity="0.04"/>

    <!-- Left Controls: Action Button & Volume -->
    <rect x="91.5" y="72" width="2.5" height="13" rx="1.2" fill="#B08D42"/>
    <rect x="91.5" y="93" width="2.5" height="22" rx="1.2" fill="#4F4B45"/>
    <rect x="91.5" y="122" width="2.5" height="22" rx="1.2" fill="#4F4B45"/>

    <!-- Right Controls: Power & Camera Control -->
    <rect x="226" y="88" width="2.5" height="34" rx="1.2" fill="#4F4B45"/>
    <rect x="226" y="162" width="2.5" height="20" rx="1.2" fill="#D4AF37"/>

    <!-- Pro Camera Array Island -->
    <g transform="translate(104, 52) scale(0.6)" opacity="0.95">
      <rect x="4" y="4" width="76" height="82" rx="20" fill="url(#cameraPlateauPro)" stroke="rgba(212, 175, 55, 0.4)" stroke-width="1.2"/>
      
      <!-- Fusion Lens -->
      <circle cx="28" cy="28" r="15" fill="#1C1B18" stroke="#D4AF37" stroke-width="1.5"/>
      <circle cx="28" cy="28" r="11" fill="url(#proLensReflect)"/>
      <circle cx="26" cy="26" r="3" fill="#4B6584" opacity="0.6"/>

      <!-- Ultra-Wide Lens -->
      <circle cx="28" cy="62" r="15" fill="#1C1B18" stroke="#D4AF37" stroke-width="1.5"/>
      <circle cx="28" cy="62" r="11" fill="url(#proLensReflect)"/>
      <circle cx="26" cy="60" r="3" fill="#4B6584" opacity="0.6"/>

      <!-- 5x Telephoto Lens -->
      <circle cx="58" cy="45" r="15" fill="#1C1B18" stroke="#D4AF37" stroke-width="1.5"/>
      <circle cx="58" cy="45" r="11" fill="url(#proLensReflect)"/>
      <circle cx="56" cy="43" r="3" fill="#4B6584" opacity="0.6"/>

      <!-- LiDAR & Flash -->
      <circle cx="58" cy="22" r="6" fill="#FBF8EE" stroke="#D4AF37" stroke-width="0.8"/>
      <circle cx="58" cy="68" r="5" fill="#111113"/>
    </g>

    <rect x="130" y="282" width="60" height="2" rx="1" fill="#FFFFFF" opacity="0.25"/>
  </g>
</svg>

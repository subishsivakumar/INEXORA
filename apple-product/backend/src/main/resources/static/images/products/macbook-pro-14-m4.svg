<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <!-- Space Black Anodized Aluminum -->
    <linearGradient id="mbpBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2E30"/>
      <stop offset="50%" stop-color="#1F2022"/>
      <stop offset="100%" stop-color="#141416"/>
    </linearGradient>

    <!-- Liquid Retina XDR Mini-LED Screen -->
    <linearGradient id="mbpScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18191C"/>
      <stop offset="100%" stop-color="#0A0B0D"/>
    </linearGradient>

    <linearGradient id="mbpGoldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#606066" stop-opacity="0.3"/>
    </linearGradient>

    <filter id="mbpShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g filter="url(#mbpShadow)">
    <!-- Pro Display Lid with Ultra-Thin Bezels -->
    <rect x="56" y="32" width="208" height="140" rx="10" fill="url(#mbpBlack)" stroke="url(#mbpGoldRim)" stroke-width="1.4"/>
    <rect x="62" y="38" width="196" height="128" rx="6" fill="url(#mbpScreen)" stroke="#111" stroke-width="1"/>
    
    <!-- Camera Notch -->
    <rect x="151" y="38" width="18" height="7" rx="2.5" fill="#000"/>
    <circle cx="160" cy="41.5" r="2" fill="#20222A"/>

    <!-- Subtle Glare -->
    <path d="M 66 42 L 225 166 L 200 166 L 66 60 Z" fill="#FFF" opacity="0.04"/>

    <!-- Rigid Aluminum Unibody Base with Ports -->
    <path d="M 26 178 L 294 178 C 296 178 298 180 296 183 L 283 204 C 281 207 277 209 273 209 L 47 209 C 43 209 39 207 37 204 L 24 183 C 22 180 24 178 26 178 Z" fill="url(#mbpBlack)" stroke="url(#mbpGoldRim)" stroke-width="1.4"/>

    <!-- Force Touch Trackpad & Thumb Recess -->
    <rect x="122" y="185" width="76" height="18" rx="3.5" fill="#1C1D20" stroke="rgba(212, 175, 55, 0.3)" stroke-width="0.8"/>
    <path d="M 148 178 L 172 178 C 170 180 168 181 160 181 C 152 181 150 180 148 178 Z" fill="#3D3E42"/>

    <!-- Side Thunderbolt Ports & MagSafe Accent Lines -->
    <rect x="36" y="184" width="4" height="2" rx="0.5" fill="#B08D42"/>
    <rect x="43" y="184" width="3" height="2" rx="0.5" fill="#888"/>
    <rect x="274" y="184" width="4" height="2" rx="0.5" fill="#888"/>
  </g>
</svg>

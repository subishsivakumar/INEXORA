<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="100%" height="100%">
  <defs>
    <!-- White Glossy Face -->
    <radialGradient id="airtagWhite" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#F2F3F6"/>
      <stop offset="100%" stop-color="#DCE0E6"/>
    </radialGradient>

    <!-- Polished Stainless Steel Ring & Inset -->
    <linearGradient id="airtagSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#E4E5E8"/>
      <stop offset="75%" stop-color="#B08D42"/>
      <stop offset="100%" stop-color="#9C9EA4"/>
    </linearGradient>

    <radialGradient id="metalDisc" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E2E4E8"/>
      <stop offset="80%" stop-color="#B6B8BE"/>
      <stop offset="100%" stop-color="#8E9096"/>
    </radialGradient>

    <filter id="airtagShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#airtagShadow)">
    <!-- Outer Stainless Steel Polished Rim -->
    <circle cx="110" cy="110" r="76" fill="url(#airtagSteel)"/>

    <!-- White Glossy Polycarbonate Face -->
    <circle cx="110" cy="110" r="71" fill="url(#airtagWhite)"/>

    <!-- Central Precision Stainless Steel Disc -->
    <circle cx="110" cy="110" r="44" fill="url(#metalDisc)" stroke="#D4AF37" stroke-width="0.8"/>

    <!-- Apple Silhouette in Stainless Steel Center -->
    <g transform="translate(100, 94) scale(0.68)" fill="#2C2D30">
      <path d="M15.5 0C14 0 11.5 1 10 2.5C8.5 4 7.5 6.5 8 9C10 9 12 8 13.5 6.5C15 5 16 2.5 15.5 0Z"/>
      <path d="M19.5 9.5C16.5 9.5 15 8 13 8C11 8 9.5 9.5 7.5 9.5C4 9.5 1 12.5 1 18C1 23.5 6 30 9 30C10.5 30 11.5 29 13 29C14.5 29 15.5 30 17 30C20 30 25 23.5 25 18C23 17 22 15 22 13C22 10.5 23.5 9.5 24 9.5C22.5 9.5 20.5 9.5 19.5 9.5Z"/>
    </g>

    <!-- Circular Text Etching Arc Accent: 'AirTag • Designed by Apple in California' -->
    <circle cx="110" cy="110" r="54" fill="none" stroke="#B08D42" stroke-width="0.8" stroke-dasharray="3, 5" opacity="0.6"/>

    <!-- Specular Light Reflection Sweep -->
    <path d="M 60 70 A 71 71 0 0 1 160 50 L 150 60 A 71 71 0 0 0 65 80 Z" fill="#FFFFFF" opacity="0.45"/>
  </g>
</svg>

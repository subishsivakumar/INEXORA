<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 220" width="100%" height="100%">
  <defs>
    <linearGradient id="studioSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E3E6"/>
      <stop offset="50%" stop-color="#BCBEC4"/>
      <stop offset="100%" stop-color="#94969E"/>
    </linearGradient>

    <linearGradient id="studioGoldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.3"/>
    </linearGradient>

    <filter id="studioShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#studioShadow)">
    <!-- 3.7-inch Tall Extruded Aluminum Enclosure -->
    <rect x="44" y="44" width="172" height="132" rx="22" fill="url(#studioSilver)" stroke="url(#studioGoldRim)" stroke-width="1.5"/>

    <!-- Top Bevel Highlight -->
    <rect x="48" y="48" width="164" height="2" rx="1" fill="#FFFFFF" opacity="0.6"/>

    <!-- Front High-Speed Ports: Dual Thunderbolt & SDXC Slot -->
    <rect x="68" y="125" width="12" height="4" rx="2" fill="#202226" stroke="#D4AF37" stroke-width="0.6"/>
    <rect x="88" y="125" width="12" height="4" rx="2" fill="#202226" stroke="#D4AF37" stroke-width="0.6"/>
    <rect x="112" y="123" width="18" height="3" rx="1" fill="#202226" stroke="#888" stroke-width="0.6"/>

    <!-- Status LED Indicator -->
    <circle cx="190" cy="126" r="1.5" fill="#FFFFFF"/>
    <circle cx="190" cy="126" r="3.5" fill="#FFFFFF" opacity="0.2"/>

    <!-- Centered Apple Logo Impression -->
    <g transform="translate(122, 65) scale(0.6)" fill="#555860" opacity="0.4">
      <path d="M15.5 0C14 0 11.5 1 10 2.5C8.5 4 7.5 6.5 8 9C10 9 12 8 13.5 6.5C15 5 16 2.5 15.5 0Z"/>
      <path d="M19.5 9.5C16.5 9.5 15 8 13 8C11 8 9.5 9.5 7.5 9.5C4 9.5 1 12.5 1 18C1 23.5 6 30 9 30C10.5 30 11.5 29 13 29C14.5 29 15.5 30 17 30C20 30 25 23.5 25 18C23 17 22 15 22 13C22 10.5 23.5 9.5 24 9.5C22.5 9.5 20.5 9.5 19.5 9.5Z"/>
    </g>

    <!-- Circular Base Air Perforation Ring -->
    <rect x="60" y="174" width="140" height="8" rx="4" fill="#1C1D20" opacity="0.75"/>
  </g>
</svg>

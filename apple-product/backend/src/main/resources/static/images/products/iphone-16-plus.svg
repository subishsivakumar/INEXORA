<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <!-- iPhone 16 Plus Teal/Ultramarine Body -->
    <linearGradient id="ip16PlusBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D5A52"/>
      <stop offset="40%" stop-color="#1B3E37"/>
      <stop offset="80%" stop-color="#122B26"/>
      <stop offset="100%" stop-color="#0B1A17"/>
    </linearGradient>

    <linearGradient id="ip16PlusScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="50%" stop-color="#09090B"/>
      <stop offset="100%" stop-color="#040405"/>
    </linearGradient>

    <linearGradient id="ip16PlusRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#4E9B8C" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="pillPlateauPlus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#274F47"/>
      <stop offset="100%" stop-color="#142B27"/>
    </linearGradient>

    <radialGradient id="plusLensReflect" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#282836"/>
      <stop offset="45%" stop-color="#12121A"/>
      <stop offset="85%" stop-color="#050508"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <filter id="ip16PlusShadow" x="-25%" y="-20%" width="150%" height="145%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#ip16PlusShadow)">
    <!-- Aerograde Aluminum Chasis - 6.7-inch Plus Proportion -->
    <rect x="90" y="24" width="140" height="272" rx="34" fill="url(#ip16PlusBody)" stroke="url(#ip16PlusRim)" stroke-width="1.8"/>
    
    <!-- Large Super Retina XDR Screen -->
    <rect x="95" y="29" width="130" height="262" rx="30" fill="url(#ip16PlusScreen)" stroke="#111114" stroke-width="1"/>
    
    <!-- Dynamic Island -->
    <rect x="141" y="40" width="38" height="11" rx="5.5" fill="#000000"/>
    <circle cx="169" cy="45.5" r="3" fill="#181822"/>

    <!-- Subtle Diagonal Glare -->
    <path d="M 98 40 L 216 216 L 202 230 L 98 72 Z" fill="#FFFFFF" opacity="0.04"/>

    <!-- Left Controls: Action Button & Volume Buttons -->
    <rect x="87.5" y="70" width="2.5" height="13" rx="1.2" fill="#B08D42"/>
    <rect x="87.5" y="92" width="2.5" height="23" rx="1.2" fill="#2D5A52"/>
    <rect x="87.5" y="122" width="2.5" height="23" rx="1.2" fill="#2D5A52"/>

    <!-- Right Controls: Power Button & Camera Control -->
    <rect x="230" y="86" width="2.5" height="36" rx="1.2" fill="#2D5A52"/>
    <rect x="230" y="164" width="2.5" height="21" rx="1.2" fill="#D4AF37"/>

    <!-- iPhone 16 Plus Vertical Pill Dual Camera Module -->
    <g transform="translate(102, 50) scale(0.64)" opacity="0.95">
      <rect x="6" y="6" width="38" height="76" rx="19" fill="url(#pillPlateauPlus)" stroke="rgba(212, 175, 55, 0.45)" stroke-width="1.2"/>
      
      <!-- Top 48MP Fusion Camera Lens -->
      <circle cx="25" cy="25" r="14" fill="#0F2420" stroke="#D4AF37" stroke-width="1.5"/>
      <circle cx="25" cy="25" r="10" fill="url(#plusLensReflect)"/>
      <circle cx="23" cy="23" r="3" fill="#52B79A" opacity="0.65"/>

      <!-- Bottom Ultra-Wide Camera Lens -->
      <circle cx="25" cy="63" r="14" fill="#0F2420" stroke="#D4AF37" stroke-width="1.5"/>
      <circle cx="25" cy="63" r="10" fill="url(#plusLensReflect)"/>
      <circle cx="23" cy="61" r="3" fill="#52B79A" opacity="0.65"/>

      <!-- True Tone Flash & Microphone -->
      <circle cx="56" cy="44" r="5" fill="#FBF8EE" stroke="#D4AF37" stroke-width="0.8"/>
      <circle cx="56" cy="26" r="2.5" fill="#0B1A17"/>
    </g>

    <rect x="127" y="284" width="66" height="2" rx="1" fill="#FFFFFF" opacity="0.25"/>
  </g>
</svg>

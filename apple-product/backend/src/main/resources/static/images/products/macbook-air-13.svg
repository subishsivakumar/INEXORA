<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <linearGradient id="mbaMidnight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222730"/>
      <stop offset="50%" stop-color="#14171E"/>
      <stop offset="100%" stop-color="#0B0D11"/>
    </linearGradient>
    <linearGradient id="mbaScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1D2028"/>
      <stop offset="100%" stop-color="#0C0E13"/>
    </linearGradient>
    <filter id="mbaShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#mbaShadow)">
    <!-- Thin 11.3mm Display Lid -->
    <rect x="62" y="38" width="196" height="132" rx="10" fill="url(#mbaMidnight)" stroke="rgba(245, 245, 247, 0.25)" stroke-width="1.2"/>
    <!-- Liquid Retina Screen -->
    <rect x="68" y="44" width="184" height="120" rx="6" fill="url(#mbaScreen)" stroke="#111" stroke-width="1"/>
    
    <!-- Camera Notch -->
    <rect x="152" y="44" width="16" height="6" rx="2" fill="#000"/>
    <circle cx="160" cy="47" r="1.8" fill="#1C1E26"/>

    <!-- Subtle Glare -->
    <path d="M 72 48 L 220 160 L 195 160 L 72 65 Z" fill="#FFF" opacity="0.04"/>

    <!-- Wedge Unibody Base -->
    <path d="M 32 176 L 288 176 C 290 176 292 178 290 180 L 278 198 C 276 201 272 203 268 203 L 52 203 C 48 203 44 201 42 198 L 30 180 C 28 178 30 176 32 176 Z" fill="url(#mbaMidnight)" stroke="rgba(245, 245, 247, 0.2)" stroke-width="1.2"/>

    <!-- Force Touch Trackpad -->
    <rect x="126" y="183" width="68" height="16" rx="3" fill="#1A1D24" stroke="rgba(245, 245, 247, 0.12)" stroke-width="0.8"/>
  </g>
</svg>

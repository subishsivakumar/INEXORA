<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="seBand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#222228"/>
      <stop offset="100%" stop-color="#141418"/>
    </linearGradient>
    <linearGradient id="seCase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3C3C44"/>
      <stop offset="100%" stop-color="#1A1A1E"/>
    </linearGradient>
    <filter id="seShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <path d="M 90 20 L 150 20 L 145 74 L 95 74 Z" fill="url(#seBand)"/>
  <path d="M 95 166 L 145 166 L 150 220 L 90 220 Z" fill="url(#seBand)"/>

  <g filter="url(#seShadow)">
    <rect x="76" y="68" width="88" height="104" rx="24" fill="url(#seCase)" stroke="rgba(245, 245, 247, 0.22)" stroke-width="1.2"/>
    <rect x="82" y="74" width="76" height="92" rx="19" fill="#08080A" stroke="#18181E" stroke-width="1"/>

    <!-- Fitness Rings Graphic -->
    <circle cx="120" cy="120" r="28" fill="none" stroke="rgba(245, 245, 247, 0.3)" stroke-width="3" stroke-dasharray="140 40"/>
    <circle cx="120" cy="120" r="21" fill="none" stroke="rgba(245, 245, 247, 0.2)" stroke-width="3" stroke-dasharray="100 40"/>
    <circle cx="120" cy="120" r="14" fill="none" stroke="rgba(245, 245, 247, 0.15)" stroke-width="3" stroke-dasharray="70 30"/>

    <rect x="164" y="86" width="5" height="20" rx="2.5" fill="#4E4E56"/>
    <rect x="164" y="116" width="3" height="26" rx="1.5" fill="#323238"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="100%" height="100%">
  <defs>
    <!-- Seamless White Multi-Touch Shell -->
    <radialGradient id="mouseShell" cx="45%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F2F3F6"/>
      <stop offset="85%" stop-color="#DDE1E8"/>
      <stop offset="100%" stop-color="#C2C6CE"/>
    </radialGradient>

    <!-- Aluminum Underchassis Rim -->
    <linearGradient id="mouseGoldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.3"/>
    </linearGradient>

    <filter id="mouseShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#mouseShadow)">
    <!-- Seamless Continuous Multi-Touch Ergonomic Arc -->
    <rect x="74" y="32" width="72" height="156" rx="36" fill="url(#mouseShell)" stroke="url(#mouseGoldRim)" stroke-width="1.4"/>

    <!-- Subtle Center Crease Line -->
    <line x1="110" y1="38" x2="110" y2="92" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6"/>

    <!-- Specular Light Reflection Sweep on Left Edge -->
    <path d="M 80 50 C 76 90 76 130 80 170 C 82 170 82 50 80 50 Z" fill="#FFFFFF" opacity="0.6"/>

    <!-- Apple Silhouette in Soft Gray Center Impression -->
    <g transform="translate(101, 130) scale(0.55)" fill="#94969E" opacity="0.5">
      <path d="M15.5 0C14 0 11.5 1 10 2.5C8.5 4 7.5 6.5 8 9C10 9 12 8 13.5 6.5C15 5 16 2.5 15.5 0Z"/>
      <path d="M19.5 9.5C16.5 9.5 15 8 13 8C11 8 9.5 9.5 7.5 9.5C4 9.5 1 12.5 1 18C1 23.5 6 30 9 30C10.5 30 11.5 29 13 29C14.5 29 15.5 30 17 30C20 30 25 23.5 25 18C23 17 22 15 22 13C22 10.5 23.5 9.5 24 9.5C22.5 9.5 20.5 9.5 19.5 9.5Z"/>
    </g>

    <!-- USB-C Bottom Port Accent Line -->
    <rect x="104" y="184" width="12" height="2" rx="1" fill="#D4AF37" opacity="0.8"/>
  </g>
</svg>

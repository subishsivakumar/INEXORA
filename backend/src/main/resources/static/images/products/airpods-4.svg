<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 220" width="100%" height="100%">
  <defs>
    <linearGradient id="ap4White" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F2F3F5"/>
      <stop offset="100%" stop-color="#DCE0E6"/>
    </linearGradient>

    <linearGradient id="ap4GoldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.4"/>
    </linearGradient>

    <filter id="ap4Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#ap4Shadow)">
    <!-- Compact AirPods 4 Case (10% smaller) -->
    <rect x="58" y="68" width="144" height="110" rx="36" fill="url(#ap4White)" stroke="url(#ap4GoldRim)" stroke-width="1.4"/>

    <!-- Horizontal Lid Seam -->
    <line x1="58" y1="98" x2="202" y2="98" stroke="#D0D3D9" stroke-width="1.2"/>

    <!-- Hidden Capacitive LED -->
    <circle cx="130" cy="120" r="2" fill="#52B79A"/>
    <circle cx="130" cy="120" r="4" fill="#52B79A" opacity="0.25"/>

    <!-- Open-Ear Acoustic Earbuds Silhouette -->
    <g transform="translate(80, 24) scale(0.68)" opacity="0.95">
      <!-- Left Open-Ear Contour Head -->
      <path d="M 32 48 C 18 48 14 34 18 20 C 22 8 40 8 48 20 C 52 26 52 34 50 38 L 50 82 C 50 86 44 90 40 90 L 40 90 C 36 90 32 86 32 82 Z" fill="url(#ap4White)" stroke="url(#ap4GoldRim)" stroke-width="1.5"/>
      <ellipse cx="28" cy="24" rx="8" ry="12" fill="#1C1D20"/>
      <rect x="38" y="56" width="3" height="12" rx="1.5" fill="#D4AF37" opacity="0.8"/>
    </g>

    <g transform="translate(132, 24) scale(0.68)" opacity="0.95">
      <!-- Right Open-Ear Contour Head -->
      <path d="M 38 48 C 52 48 56 34 52 20 C 48 8 30 8 22 20 C 18 26 18 34 20 38 L 20 82 C 20 86 26 90 30 90 L 30 90 C 34 90 38 86 38 82 Z" fill="url(#ap4White)" stroke="url(#ap4GoldRim)" stroke-width="1.5"/>
      <ellipse cx="42" cy="24" rx="8" ry="12" fill="#1C1D20"/>
      <rect x="29" y="56" width="3" height="12" rx="1.5" fill="#D4AF37" opacity="0.8"/>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <linearGradient id="imacBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D445A"/>
      <stop offset="100%" stop-color="#1B2B3A"/>
    </linearGradient>
    <linearGradient id="imacScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#202A34"/>
      <stop offset="100%" stop-color="#0E141B"/>
    </linearGradient>
    <linearGradient id="imacStand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A6580"/>
      <stop offset="100%" stop-color="#283C4F"/>
    </linearGradient>
    <filter id="imacShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#imacShadow)">
    <!-- Stand Column -->
    <rect x="146" y="152" width="28" height="48" rx="2" fill="url(#imacStand)"/>
    <!-- Stand Foot Base -->
    <rect x="124" y="198" width="72" height="6" rx="3" fill="url(#imacStand)" stroke="rgba(245, 245, 247, 0.2)" stroke-width="0.8"/>

    <!-- 4.5K Retina Display Enclosure -->
    <rect x="65" y="32" width="190" height="126" rx="10" fill="#E8EDF2" stroke="rgba(245, 245, 247, 0.3)" stroke-width="1.2"/>
    <!-- Glass Display Border -->
    <rect x="71" y="38" width="178" height="96" rx="6" fill="url(#imacScreen)" stroke="#0E141B" stroke-width="1"/>
    <!-- Lower Chin in Blue Hue -->
    <rect x="71" y="134" width="178" height="20" rx="3" fill="url(#imacBlue)"/>

    <!-- 1080p FaceTime Camera -->
    <circle cx="160" cy="42" r="1.8" fill="#304252"/>
  </g>
</svg>

      <rect x="211" y="78" width="13" height="13" rx="3"/>
      <rect x="227" y="78" width="13" height="13" rx="3"/>
      <rect x="243" y="78" width="13" height="13" rx="3"/>
      <rect x="259" y="78" width="17" height="13" rx="3"/>
    </g>

    <!-- ASDF Row -->
    <g fill="url(#kbKeys)" stroke="#D8DCE2" stroke-width="0.8">
      <rect x="44" y="94" width="25" height="13" rx="3"/>
      <rect x="72" y="94" width="13" height="13" rx="3"/>
      <rect x="88" y="94" width="13" height="13" rx="3"/>
      <rect x="104" y="94" width="13" height="13" rx="3"/>
      <rect x="120" y="94" width="13" height="13" rx="3"/>
      <rect x="136" y="94" width="13" height="13" rx="3"/>
      <rect x="152" y="94" width="13" height="13" rx="3"/>
      <rect x="168" y="94" width="13" height="13" rx="3"/>
      <rect x="184" y="94" width="13" height="13" rx="3"/>
      <rect x="200" y="94" width="13" height="13" rx="3"/>

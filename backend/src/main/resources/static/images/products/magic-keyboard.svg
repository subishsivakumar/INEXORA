    <!-- Spacebar & Modifier Bottom Row -->
    <g fill="url(#kbKeys)" stroke="#D8DCE2" stroke-width="0.8">
      <rect x="44" y="110" width="30" height="13" rx="3"/>
      <rect x="77" y="110" width="14" height="13" rx="3"/>
      <rect x="94" y="110" width="16" height="13" rx="3"/>
      <rect x="113" y="110" width="86" height="13" rx="3"/>
      <rect x="202" y="110" width="16" height="13" rx="3"/>
      <rect x="221" y="110" width="14" height="13" rx="3"/>
      <rect x="238" y="110" width="12" height="6" rx="2"/>
      <rect x="238" y="117" width="12" height="6" rx="2"/>
      <rect x="253" y="110" width="23" height="13" rx="3"/>
    </g>
  </g>
</svg>

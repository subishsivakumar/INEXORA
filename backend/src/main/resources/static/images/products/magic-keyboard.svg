<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <!-- Anodized Silver Aluminum Wedge Base -->
    <linearGradient id="kbSilver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E4E5E8"/>
      <stop offset="50%" stop-color="#C6C8CE"/>
      <stop offset="100%" stop-color="#9FA2A8"/>
    </linearGradient>

    <!-- White Keycaps -->
    <linearGradient id="kbKeys" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F1F4"/>
    </linearGradient>

    <linearGradient id="kbGoldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.3"/>
    </linearGradient>

    <filter id="kbShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#kbShadow)">
    <!-- Sleek Wedge Profile Aluminum Case -->
    <rect x="36" y="42" width="248" height="116" rx="14" fill="url(#kbSilver)" stroke="url(#kbGoldRim)" stroke-width="1.4"/>

    <!-- Key Rows Simulation (Scissor Mechanism Architecture) -->
    <!-- Function Row -->
    <g fill="url(#kbKeys)" stroke="#D8DCE2" stroke-width="0.8">
      <rect x="44" y="50" width="16" height="10" rx="3"/>
      <rect x="63" y="50" width="13" height="10" rx="3"/>
      <rect x="79" y="50" width="13" height="10" rx="3"/>
      <rect x="95" y="50" width="13" height="10" rx="3"/>
      <rect x="111" y="50" width="13" height="10" rx="3"/>
      <rect x="127" y="50" width="13" height="10" rx="3"/>
      <rect x="143" y="50" width="13" height="10" rx="3"/>
      <rect x="159" y="50" width="13" height="10" rx="3"/>
      <rect x="175" y="50" width="13" height="10" rx="3"/>
      <rect x="191" y="50" width="13" height="10" rx="3"/>
      <rect x="207" y="50" width="13" height="10" rx="3"/>
      <rect x="223" y="50" width="13" height="10" rx="3"/>
      <rect x="239" y="50" width="13" height="10" rx="3"/>
      
      <!-- Top-Right Touch ID Biometric Sensor Key -->
      <rect x="255" y="50" width="21" height="10" rx="3" fill="#F4F5F8" stroke="#D4AF37" stroke-width="1.2"/>
      <circle cx="265.5" cy="55" r="3" fill="none" stroke="#D4AF37" stroke-width="0.8"/>
    </g>

    <!-- Number Row -->
    <g fill="url(#kbKeys)" stroke="#D8DCE2" stroke-width="0.8">
      <rect x="44" y="63" width="13" height="12" rx="3"/>
      <rect x="60" y="63" width="13" height="12" rx="3"/>
      <rect x="76" y="63" width="13" height="12" rx="3"/>
      <rect x="92" y="63" width="13" height="12" rx="3"/>
      <rect x="108" y="63" width="13" height="12" rx="3"/>
      <rect x="124" y="63" width="13" height="12" rx="3"/>
      <rect x="140" y="63" width="13" height="12" rx="3"/>
      <rect x="156" y="63" width="13" height="12" rx="3"/>
      <rect x="172" y="63" width="13" height="12" rx="3"/>
      <rect x="188" y="63" width="13" height="12" rx="3"/>
